version: '3'
services:

  ### MySQL db for Keycloak server to persist data
  keycloak-mysql:
    image: mysql:8
    container_name: KEYCLOAK_MYSQL
    restart: unless-stopped
    volumes:
      - ./db-data/MySQL/keycloak:/var/lib/mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak

  ### KeyCloak-Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: KEYCLOAK-SERVER
    command: [ "start-dev", "--import-realm" ]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm/:/opt/keycloak/data/import
    depends_on:
      - keycloak-mysql

  ### Redis
  redis:
    image: redis:7.2.3
    container_name: REDIS
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ./db-data/Redis:/data

  ## Kafka with KRaft
  kafka-kraft:
    image: bitnami/kafka:3.7.0
    hostname: kafka-kraft
    container_name: KAFKA-KRAFT
    ports:
      - "9092:9092"
      - "9094:9094"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092,EXTERNAL://kafka-kraft:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093

      - KAFKA_BROKER_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - BITNAMI_DEBUG=yes
      - KAFKA_CFG_NUM_PARTITIONS=2
    volumes:
      - ./broker:/bitnami

  # ----------------------------Services----------------------------
  # --- --- --- Eureka Server
  discovery-server:
    image: dukeofjava/eureka:0.0.1-SNAPSHOT
    container_name: DISCOVERY-SERVER
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOST=localhost
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 5s
      retries: 5

  # --- --- --- API-Gateway
  api-gateway:
    image: dukeofjava/api-gateway:0.0.1-SNAPSHOT
    container_name: API-GATEWAY
    ports:
      - "9999:9999"
    environment:
      - KEYCLOAK_SERVER_HOST=keycloak
      - EUREKA_SERVER_HOST=discovery-server
      - MICROSERVICE_AUTHENTICATION_SERVICE_URL=http://authentication-service/keycloak-user
#      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY= TRACE
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      authentication-service:
        condition: service_started

  # --- --- --- Authentication-Service
  authentication-service:
    image: dukeofjava/authentication:0.0.1-SNAPSHOT
    container_name: AUTHENTICATION-SERVICE
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_SERVER_HOST=keycloak
      - EUREKA_SERVER_HOST=discovery-server
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TIME_TO_LIVE=600000 # 1hour
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started

  # --- --- --- TimeEntry-Service
  time-entry-service:
    image: dukeofjava/time-entry:0.0.1-SNAPSHOT
    container_name: TIME-ENTRY-SERVICE
    ports:
      - "8082:8082"
    environment:
      - KEYCLOAK_SERVER_HOST=keycloak
      - EUREKA_SERVER_HOST=discovery-server
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TIME_TO_LIVE=600000 # 1hour
      - AUTHENTICATION_SERVICE_HANDLE_USER_BASE_URL=authentication-service
      - KAFKA_SERVER_HOST=kafka-kraft
      - KAFKA_SERVER_PORT=9094
    healthcheck:
      test: "curl --fail --silent localhost:8082/actuator/health | grep UP || exit 1"
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      kafka-kraft:
        condition: service_started

  # --- --- --- Project-Service
  project-service:
    image: dukeofjava/project:0.0.1-SNAPSHOT
    container_name: PROJECT-SERVICE
    ports:
      - "8083:8083"
    environment:
      - KEYCLOAK_SERVER_HOST=keycloak
      - EUREKA_SERVER_HOST=discovery-server
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TIME_TO_LIVE=600000 # 1hour
      - KAFKA_SERVER_HOST_AND_PORT=kafka-kraft:9094
    healthcheck:
      test: "curl --fail --silent localhost:8083/actuator/health | grep UP || exit 1"
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      kafka-kraft:
        condition: service_started

  # --- --- --- Task-Service
  task-service:
    image: dukeofjava/task:0.0.1-SNAPSHOT
    container_name: TASK-SERVICE
    ports:
      - "8084:8084"
    environment:
      - KEYCLOAK_SERVER_HOST=keycloak
      - EUREKA_SERVER_HOST=discovery-server
      - KAFKA_SERVER_HOST_AND_PORT=kafka-kraft:9094
    healthcheck:
      test: "curl --fail --silent localhost:8084/actuator/health | grep UP || exit 1"
      interval: 2s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-kraft:
        condition: service_started

